[project]
name = "nostrhost-mcp"
version = "0.1.0"
description = "Thin MCP protocol adapter over the NostrHost native operation model"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.1.1",
    "coincurve>=21.0.0",
]

[project.scripts]
nostrhost-mcp = "nostrhost_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nostrhost_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"